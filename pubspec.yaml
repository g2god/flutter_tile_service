name: flutter_tile_service
description: "A production-ready Flutter plugin for Android Quick Settings Tiles with native lifecycle resilience, multi-tile slots, and typed events."
version: 0.1.0
homepage: https://github.com/example/flutter_tile_service
repository: https://github.com/example/flutter_tile_service
issue_tracker: https://github.com/example/flutter_tile_service/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_tile_service
        pluginClass: FlutterTileServicePlugin
